# Recounts the real numbers (every family repo's commits, lines and tests:
# scripts/stats.mjs), tests, then deploys public/ to GitHub Pages: on every
# push to main and once a day by itself, so the numbers stay current with
# nobody touching it. Everything else changes only with a push.
# One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
name: Deploy to Pages

on:
  push:
    branches: ['main']
  schedule:
    # 00:17 in Taipei, every day.
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  # One deploy at a time, without cancelling any (a cancelled run mails its
  # pusher): a run waits for the earlier ones still going, and steps aside,
  # quietly, when a newer run of this workflow will deploy instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - name: Wait for the earlier deploys; step aside for a newer one
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2" 2>/dev/null; }
          wf=$(api "actions/runs/$GITHUB_RUN_ID" .workflow_id) || wf=
          while [ -n "$wf" ]; do
            runs=$(api "actions/workflows/$wf/runs?branch=$GITHUB_REF_NAME&per_page=30" "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {n: .run_number, done: (.status == \"completed\")}]") || runs='[]'
            if [ "$(jq "[.[] | select(.n > $GITHUB_RUN_NUMBER)] | length" <<<"$runs")" != 0 ]; then
              echo "A newer run deploys instead."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$(jq "[.[] | select(.n < $GITHUB_RUN_NUMBER and (.done | not))] | length" <<<"$runs")" = 0 ] && break
            echo "Waiting for an earlier run to finish."; sleep 20
          done
          echo go=true >> "$GITHUB_OUTPUT"

  build:
    needs: queue
    if: needs.queue.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # (Its whole history: the counts include this repo too.)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared kit (Orbit-Core/kit), for the tests
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Orbit-Core
          path: .shared
          sparse-checkout: kit
      - run: ln -sfn .shared/kit .kit
      - name: Recount the numbers from every family repo
        # Each public repo cloned whole beside a link to this one (its history
        # and every change, for the churn). A clone that fails keeps the last counts
        # committed here rather than publishing wrong ones.
        run: |
          mkdir -p .family && ln -sfn "$PWD" .family/Orbit-Showcase
          ok=1
          for r in Orbit-Core Orbit-Sports Orbit-Transit Orbit-Weather Orbit-Class Orbit-Words Orbit-Beats Orbit-Law Orbit-Securities Orbit-Money; do
            git clone --quiet "https://github.com/JayPengX/$r.git" ".family/$r" || ok=0
          done
          if [ "$ok" = 1 ] && TZ=Asia/Taipei node scripts/stats.mjs .family > /tmp/stats.json; then
            mv /tmp/stats.json public/data/stats.json
            node -e "const s=require('./public/data/stats.json');console.log(s.apps+' apps, '+s.commits+' updates, '+s.lines+' lines, '+s.tests+' checks')"
          else
            echo "::warning::Counts not refreshed; the last committed ones are published."
          fi
      - name: Run tests
        run: npm test
      - name: Minify, and address every file by its content
        # Each script and stylesheet minified and stamped with its own content
        # hash (the kit's kit/stamp-app.mjs): browsers fetch a changed file at
        # once, never mix it with cached older ones, and keep every file the
        # deploy didn't change.
        run: node scripts/stamp-version.mjs "$(git rev-parse HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # A clash with another deploy or a hiccup at GitHub: tried once more.
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (again)
        id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
