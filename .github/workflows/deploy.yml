# Recounts the real numbers (every family repo's commits, lines and tests:
# scripts/stats.mjs), records and builds every demo again from each app's
# main (scripts/demo/refresh.mjs), tests, then deploys public/ to Cloudflare
# (Orbit-Core deploy/cf-site.mjs): on every push to main and once a day by
# itself, so the numbers and the demos stay current with nobody touching
# them. Everything else changes only with a push.
name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  schedule:
    # 10:17 in Taipei, every day (daylight and open markets for the demos).
    - cron: '17 2 * * *'
  # look=true: started by the proxy Worker every hour from 08:22 to 21:22 in Taipei
  # (Orbit-Core ops.js startShowcaseLook; GitHub's own hourly timer ran 2 or 3 of 14 a
  # day, 11-21 to 11-23): the demos recorded again only when an app's main or the kit
  # has moved on since (scripts/demo/stale.mjs; Jay 11-21: "make sure demo catch up the
  # newest version"), else nothing runs. Without it, by hand: the whole deploy.
  workflow_dispatch:
    inputs:
      look:
        description: 'Only if an app or the kit is newer than the live demos'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: read

jobs:
  # One deploy at a time, without cancelling any (a cancelled run mails its
  # pusher): a run waits for the earlier ones still going, and steps aside,
  # quietly, when a newer run of this workflow will deploy instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      go: ${{ steps.wait.outputs.go == 'true' && (inputs.look != 'true' || steps.look.outputs.go == 'true') }}
    steps:
      - name: Wait for the earlier deploys; step aside for a newer one
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2" 2>/dev/null; }
          wf=$(api "actions/runs/$GITHUB_RUN_ID" .workflow_id) || wf=
          while [ -n "$wf" ]; do
            runs=$(api "actions/workflows/$wf/runs?branch=$GITHUB_REF_NAME&per_page=30" "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {n: .run_number, done: (.status == \"completed\"), started: (.event == \"workflow_dispatch\")}]") || runs='[]'
            # (A newer one started by hand or by the proxy's hourly look may not deploy at all
            # (nothing newer): only a newer push or schedule takes this one's place.)
            if [ "$(jq "[.[] | select(.n > $GITHUB_RUN_NUMBER and (.started | not))] | length" <<<"$runs")" != 0 ]; then
              echo "A newer run deploys instead."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$(jq "[.[] | select(.n < $GITHUB_RUN_NUMBER and (.done | not))] | length" <<<"$runs")" = 0 ] && break
            echo "Waiting for an earlier run to finish."; sleep 20
          done
          echo go=true >> "$GITHUB_OUTPUT"
      # The hourly look: on only when an app or the kit is newer than the live demos.
      - if: inputs.look == 'true' && steps.wait.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: inputs.look == 'true' && steps.wait.outputs.go == 'true'
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/demo/stale.mjs

  build:
    needs: queue
    if: needs.queue.outputs.go == 'true'
    # (Ubuntu 24.04 by name, not -latest: the demos' Playwright 1.63 installs its
    # browser's system parts for the Ubuntu it knows, and -latest moves to a
    # newer one by itself; 24.04's runners are GitHub's until about 2029.)
    runs-on: ubuntu-24.04
    steps:
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # (Its whole history: the counts include this repo too.)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared kit (Orbit-Core/kit), for the tests
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Orbit-Core
          path: .shared
          sparse-checkout: |
            kit
            deploy
      - run: ln -sfn .shared/kit .kit
      - name: Recount the numbers from every family repo
        # Each public repo cloned whole beside a link to this one (its history
        # and every change, for the churn). A clone that fails keeps the last counts
        # committed here rather than publishing wrong ones.
        run: |
          mkdir -p .family && ln -sfn "$PWD" .family/Orbit-Showcase
          ok=1
          for r in Orbit-Core Orbit-Sports Orbit-Transit Orbit-Weather Orbit-Class Orbit-Words Orbit-Beats Orbit-Law Orbit-Securities Orbit-Money Orbit-News; do
            git clone --quiet "https://github.com/JayPengX/$r.git" ".family/$r" || ok=0
          done
          if [ "$ok" = 1 ] && TZ=Asia/Taipei node scripts/stats.mjs .family > /tmp/stats.json; then
            mv /tmp/stats.json public/data/stats.json
            node -e "const s=require('./public/data/stats.json');console.log(s.apps+' apps, '+s.commits+' updates, '+s.lines+' lines, '+s.tests+' checks')"
            # (What 問 Orbit knows besides the tree: every feature, Jay's dated rules, the numbers.)
            node scripts/know.mjs .family public/data/stats.json > /tmp/know.json && mv /tmp/know.json public/data/know.json || echo "::warning::問 Orbit's knowledge not refreshed"
          else
            echo "::warning::Counts not refreshed; the last committed ones are published."
          fi
      - name: Every demo again, from each app's main
        # Recorded afresh and built from today's code (scripts/demo/refresh.mjs);
        # a demo whose recording fails keeps the copy committed here. Never
        # stops the deploy.
        timeout-minutes: 40
        run: |
          if [ -d .family/Orbit-Core ] && [ -d .family/Orbit-Class ]; then
            npm i --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium && (sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1 || true) && ln -sfn "$PWD/node_modules" .family/node_modules || echo "::warning::No browser for the demos"
            (cd .family/Orbit-Class && npm ci --no-audit --no-fund && npm run build) || echo "::warning::Class didn't build; its demo stays as committed"
            node scripts/demo/refresh.mjs --repos .family || echo "::warning::The demos weren't refreshed; the committed ones are published."
          else
            echo "::warning::The family's repos weren't cloned; the committed demos are published."
          fi
      - name: Run tests
        run: npm test
      - name: Minify, and address every file by its content
        # Each script and stylesheet minified and stamped with its own content
        # hash (the kit's kit/stamp-app.mjs): browsers fetch a changed file at
        # once, never mix it with cached older ones, and keep every file the
        # deploy didn't change.
        run: node scripts/stamp-version.mjs "$(git rev-parse HEAD)"
      # The site on Cloudflare, at its address on the family's domain
      # (Orbit-Core deploy/cf-site.mjs): what phones are served.
      - name: Publish to Cloudflare
        run: node .shared/deploy/cf-site.mjs Orbit-Showcase public
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
