<!-- Jay's own page, at the bare domain (site.js serves it at /). One file,
     nothing loaded: the kit's tokens copied in (Orbit-Core docs/DESIGN.md),
     the words in both languages, picked by the browser's. Open to all. -->
<style>
  :root {
    color-scheme: light dark;
    --page: #f2f2f7; --cell: #fff; --label: #000; --label-2: rgba(60, 60, 67, 0.6);
    --sep: rgba(60, 60, 67, 0.29); --press: rgba(0, 0, 0, 0.05); --tile: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #000; --cell: #1c1c1e; --label: #fff; --label-2: rgba(235, 235, 245, 0.6);
      --sep: rgba(84, 84, 88, 0.6); --press: rgba(255, 255, 255, 0.06); --tile: #3a3a3c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--page); color: var(--label);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(48px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 520px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0 16px; font: 700 44px/1.1 ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: -0.01em; }
  .line { margin: 8px 16px 0; font-size: 17px; color: var(--label-2); }
  ul { list-style: none; margin: 32px 0 0; padding: 0; background: var(--cell); border-radius: 22px; overflow: hidden; }
  li + li a::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: 0.5px solid var(--sep); }
  a { position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 64px; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a:active, a:hover { background: var(--press); }
  a:focus-visible { outline: 2px solid #0a84ff; outline-offset: -2px; border-radius: 22px; }
  .icon { flex: none; width: 40px; height: 40px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: var(--tile); color: #fff; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .icon.glyph svg { width: 24px; height: 24px; }
  .text { flex: 1; min-width: 0; }
  .name { font-weight: 500; }
  .sub { font-size: 15px; color: var(--label-2); }
  .chev { flex: none; width: 8px; height: 14px; color: var(--label-2); opacity: 0.6; }
  footer { margin-top: 48px; font-size: 13px; color: var(--label-2); }
  @media (min-width: 900px) { h1 { font-size: 56px; } .line { font-size: 19px; } }
</style>
</head>
