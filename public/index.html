<!-- kit:head: where the app's stylesheets end, before any module. The kit
     comes from one place for every app (Orbit-Core's GitHub Pages, same
     site as the apps), each file at the hash this device last saw (orbit.kit
     and orbit.kitFiles, noted from the kit's version.json by boot.js and
     orbit.mjs kitLatest; on a first visit the hashes the app's deploy
     baked in, the `null` at the end), so a change to the kit is one push
     to Orbit-Core and a phone downloads only the files it changed. A kit
     file newer than the app's deploy (not in its list) is mapped from those
     hashes too, never left at a bare address the browser keeps 10 minutes. -->
